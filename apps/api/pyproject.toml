[project]
name = "ai-story-studio-api"
version = "0.1.0"
description = "Local-first AI Story Studio API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite==0.21.0",
  "alembic==1.16.1",
  "argon2-cffi==23.1.0",
  "asyncpg==0.30.0",
  "celery[redis]==5.5.3",
  "edge-tts==7.3.1",
  "email-validator==2.2.0",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "jsonschema==4.24.0",
  "minio==7.2.15",
  "pillow==11.2.1",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.5",
  "pydantic-settings==2.9.1",
  "pyjwt==2.10.1",
  "python-multipart==0.0.20",
  "redis==5.2.1",
  "sqlalchemy[asyncio]==2.0.41",
  "sse-starlette==2.3.6",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
  "mypy==1.16.0",
  "pytest==8.4.0",
  "pytest-asyncio==1.0.0",
  "pytest-cov==6.1.1",
  "ruff==0.11.13",
  "types-jsonschema==4.24.0.20250528"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../.."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

