name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project apps/api --extra dev --locked
      - run: uv run --project apps/api python scripts/verify/validate_contracts.py
      - run: uv run --project apps/api ruff check apps/api workers
      - run: uv run --project apps/api mypy apps/api/src
      - run: uv run --project apps/api pytest apps/api/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file infra/compose/local/.env.example -f infra/compose/local/docker-compose.yml config --quiet

